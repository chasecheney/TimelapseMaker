<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Apple icon grid: 824×824 squircle-ish rounded rect centered -->
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="186" ry="186"/>
    </clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#0B1B3A"/>
      <stop offset="0.45" stop-color="#1E3A78"/>
      <stop offset="0.72" stop-color="#8A4C8F"/>
      <stop offset="0.86" stop-color="#F2734A"/>
      <stop offset="1"    stop-color="#FFB347"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2F55"/>
      <stop offset="1" stop-color="#151A38"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171B3C"/>
      <stop offset="1" stop-color="#0B0E24"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFF3C4" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#FFC857" stop-opacity="0.55"/>
      <stop offset="1"   stop-color="#FFC857" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6D6"/>
      <stop offset="1" stop-color="#FFB13B"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softBlur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- drop shadow behind the tile -->
  <rect x="100" y="100" width="824" height="824" rx="186" ry="186" fill="#000" opacity="0.001" filter="url(#shadow)"/>

  <g clip-path="url(#tile)">
    <!-- sky -->
    <rect x="100" y="100" width="824" height="824" fill="url(#sky)"/>

    <!-- sun path: an arc across the sky, drawn as dots that brighten toward the present -->
    <!-- arc centre (512, 690), radius 330 -->
    <path d="M 200 640 A 330 330 0 0 1 824 640" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="6" stroke-dasharray="4 26" stroke-linecap="round"/>

    <!-- earlier sun positions (ghosts), left → right in time -->
    <circle cx="238" cy="565" r="22" fill="#FFD27A" opacity="0.18"/>
    <circle cx="317" cy="453" r="26" fill="#FFD27A" opacity="0.30"/>
    <circle cx="427" cy="386" r="30" fill="#FFD27A" opacity="0.46"/>
    <circle cx="556" cy="363" r="34" fill="#FFD27A" opacity="0.64"/>

    <!-- current sun with glow -->
    <circle cx="690" cy="404" r="150" fill="url(#sunGlow)"/>
    <circle cx="690" cy="404" r="58" fill="url(#sunFill)"/>

    <!-- hills -->
    <path d="M 100 700 C 220 640 300 660 380 700 C 470 745 560 660 660 680 C 760 700 830 640 924 660 L 924 924 L 100 924 Z" fill="url(#hillBack)"/>
    <path d="M 100 790 C 190 740 280 760 360 790 C 450 825 540 760 640 770 C 740 780 820 740 924 770 L 924 924 L 100 924 Z" fill="url(#hillFront)"/>

    <!-- crop brackets: the frame you're keeping -->
    <g fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
      <path d="M 218 340 L 218 250 L 308 250"/>
      <path d="M 716 250 L 806 250 L 806 340"/>
      <path d="M 218 704 L 218 794 L 308 794"/>
      <path d="M 716 794 L 806 794 L 806 704"/>
    </g>

    <!-- top gloss -->
    <rect x="100" y="100" width="824" height="420" fill="url(#gloss)"/>
  </g>
</svg>
